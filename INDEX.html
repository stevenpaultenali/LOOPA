<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>LOOPA · Use it. Share it. Keep it moving.</title>
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700;800&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #F8F7F2;
            --card: #fff;
            --tx: #17201D;
            --mu: #6E7975;
            --ac: #18A673;
            --acd: #0f7f58;
            --mint: #DDF5EA;
            --fo: #102A24;
            --am: #E8B04A;
            --ln: rgba(16, 42, 36, .09);
            --sh: 0 1px 2px rgba(16, 42, 36, .05), 0 8px 24px rgba(16, 42, 36, .06);
            --v1: 92%;
            --v2: 84%;
            --bad: #c8432f;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px)
        }

        :root:not([data-theme=light]) {
            color-scheme: light dark
        }

        @media(prefers-color-scheme:dark) {
            :root:not([data-theme=light]) {
                --bg: #0B1411;
                --card: #12201B;
                --tx: #F2F6F3;
                --mu: #91A39B;
                --ac: #28C58A;
                --mint: #173a2e;
                --ln: rgba(255, 255, 255, .08);
                --sh: 0 8px 24px rgba(0, 0, 0, .35);
                --v1: 20%;
                --v2: 13%;
                --fo: #0d1f1a
            }
        }

        :root[data-theme=dark] {
            --bg: #0B1411;
            --card: #12201B;
            --tx: #F2F6F3;
            --mu: #91A39B;
            --ac: #28C58A;
            --mint: #173a2e;
            --ln: rgba(255, 255, 255, .08);
            --sh: 0 8px 24px rgba(0, 0, 0, .35);
            --v1: 20%;
            --v2: 13%;
            --fo: #0d1f1a
        }

        * {
            box-sizing: border-box
        }

        html {
            scroll-behavior: smooth;
            height: 100%
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--tx);
            font: 400 15px/1.55 Inter, system-ui, sans-serif;
            min-height: 100%;
            transition: background .3s
        }

        h1,
        h2,
        h3,
        .hd {
            font-family: Manrope, Inter, sans-serif;
            letter-spacing: -.03em;
            line-height: 1.08;
            margin: 0
        }

        h1 {
            font-size: clamp(2.4rem, 5.6vw, 4.4rem);
            font-weight: 800
        }

        h2 {
            font-size: clamp(1.6rem, 3vw, 2.3rem);
            font-weight: 800
        }

        h3 {
            font-size: 1.15rem;
            font-weight: 700
        }

        button,
        input,
        select,
        textarea {
            font: inherit;
            color: inherit
        }

        button {
            cursor: pointer;
            border: 1px solid var(--ln);
            background: var(--card);
            padding: 10px 16px;
            border-radius: 999px;
            font-weight: 600;
            min-height: 44px;
            transition: transform .2s, background .2s, box-shadow .2s
        }

        button:hover {
            transform: translateY(-1px);
            box-shadow: var(--sh)
        }

        button.pri {
            background: var(--ac);
            color: #04140e;
            border-color: transparent
        }

        button.pri:hover {
            background: var(--acd);
            color: #fff
        }

        button.bad {
            color: var(--bad)
        }

        button.dk {
            background: var(--fo);
            color: #fff;
            border-color: transparent
        }

        :focus-visible {
            outline: 3px solid var(--am);
            outline-offset: 2px
        }

        input,
        select,
        textarea {
            width: 100%;
            background: var(--card);
            border: 1px solid var(--ln);
            border-radius: 14px;
            padding: 12px 14px;
            min-height: 46px
        }

        label {
            display: block;
            font-weight: 600;
            font-size: 13px;
            margin: 12px 0 0
        }

        label>* {
            margin-top: 6px;
            font-weight: 400
        }

        .mu {
            color: var(--mu)
        }

        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px
        }

        .acts {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 12px
        }

        .wrap {
            max-width: 1180px;
            margin: 0 auto;
            padding: 0 20px
        }

        header {
            position: sticky;
            top: 0;
            z-index: 20;
            background: color-mix(in srgb, var(--bg) 85%, transparent);
            backdrop-filter: blur(14px);
            border-bottom: 1px solid var(--ln);
            padding-top: env(safe-area-inset-top, 0px)
        }

        header .wrap {
            display: flex;
            align-items: center;
            gap: 14px;
            height: 68px
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 9px;
            font: 800 21px Manrope;
            letter-spacing: -.04em;
            cursor: pointer;
            background: none;
            border: 0;
            padding: 0;
            box-shadow: none !important;
            transform: none !important
        }

        nav {
            display: flex;
            gap: 2px;
            margin: 0 auto
        }

        nav button {
            border: 0;
            background: none;
            color: var(--mu);
            position: relative
        }

        nav button.on,
        nav button:hover {
            color: var(--tx);
            background: var(--mint);
            box-shadow: none
        }

        .ib {
            width: 44px;
            padding: 0;
            display: grid;
            place-items: center;
            position: relative
        }

        .dot {
            position: absolute;
            top: 6px;
            right: 6px;
            background: var(--am);
            color: #000;
            font-size: 10px;
            border-radius: 99px;
            min-width: 17px;
            height: 17px;
            display: grid;
            place-items: center;
            font-weight: 700
        }

        .av {
            display: inline-grid;
            place-items: center;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            font: 700 12px Manrope;
            color: #fff;
            background: hsl(var(--h) 45% 38%);
            flex: none
        }

        .av.l {
            width: 84px;
            height: 84px;
            font-size: 30px
        }

        .tag {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 12px;
            font-weight: 600;
            padding: 3px 10px;
            border-radius: 99px;
            background: var(--mint);
            color: var(--acd)
        }

        

        .tag.no {
            background: rgba(200, 67, 47, .12);
            color: var(--bad)
        }

        .tag.wait {
            background: rgba(232, 176, 74, .2);
            color: #9a6b0c
        }

        .tag.act {
            background: var(--fo);
            color: #fff
        }

        main {
            padding: 28px 0 110px
        }

        section {
            margin: 56px 0
        }

        .sec {
            display: flex;
            justify-content: space-between;
            align-items: end;
            gap: 12px;
            margin-bottom: 20px
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px
        }

        .card {
            background: var(--card);
            border-radius: 22px;
            box-shadow: var(--sh);
            border: 1px solid var(--ln);
            overflow: hidden;
            transition: transform .25s, box-shadow .25s
        }

        .item {
            cursor: pointer
        }

        .item:hover {
            transform: translateY(-4px)
        }

        .vis {
            aspect-ratio: 4/3;
            display: grid;
            place-items: center;
            font-size: 76px;
            position: relative;
            overflow: hidden;
            background: linear-gradient(145deg, hsl(var(--h) 50% var(--v1)), hsl(var(--h) 45% var(--v2)))
        }

        .vis img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform .5s
        }

        .item:hover .vis img,
        .item:hover .vis>span {
            transform: scale(1.05)
        }

        .vis>span {
            transition: transform .5s
        }

        .vis .tag {
            position: absolute;
            top: 12px;
            left: 12px;
            background: var(--card);
            color: var(--tx)
        }

        .vis .tr {
            left: auto;
            right: 12px
        }

        .cb {
            padding: 16px 18px 18px
        }

        .pr {
            font: 800 18px Manrope
        }

        .sw {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--ac);
            box-shadow: 0 0 0 3px var(--mint)
        }

        .sw.o {
            background: var(--mu);
            box-shadow: none
        }

        .loopbadge {
            display: inline-flex;
            gap: 6px;
            font-size: 12px;
            font-weight: 600;
            color: var(--acd);
            background: var(--mint);
            padding: 3px 10px;
            border-radius: 99px;
            margin-top: 8px
        }

        .hero {
            display: grid;
            grid-template-columns: 1.05fr .95fr;
            gap: 30px;
            align-items: center;
            background: var(--fo);
            color: #F2F6F3;
            border-radius: 32px;
            padding: 56px;
            overflow: hidden;
            position: relative
        }

        .hero p {
            font-size: 1.15rem;
            color: #b9cdc4;
            max-width: 30em;
            margin: 20px 0 0
        }

        .hero h1 em {
            font-style: normal;
            color: var(--ac)
        }

        .hero button {
            border-color: rgba(255, 255, 255, .2);
            background: transparent;
            color: #fff
        }

        .hero .pri {
            background: var(--ac);
            color: #04140e
        }

        .loop {
            position: relative;
            width: min(100%, 430px);
            aspect-ratio: 1;
            margin: auto
        }

        .loop svg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%
        }

        .ring {
            transform-origin: 50% 50%;
            animation: spin 60s linear infinite
        }

        .nd {
            position: absolute;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, .08);
            border: 1px solid rgba(255, 255, 255, .2);
            border-radius: 99px;
            padding: 6px 14px;
            font: 700 11px Manrope;
            letter-spacing: .08em;
            white-space: nowrap;
            backdrop-filter: blur(6px)
        }

        .nd.hl {
            background: var(--ac);
            color: #04140e;
            border: 0
        }

        .fl {
            position: absolute;
            transform: translate(-50%, -50%);
            background: var(--card);
            color: var(--tx);
            border-radius: 16px;
            padding: 8px 12px;
            font-size: 12px;
            font-weight: 600;
            box-shadow: 0 10px 30px rgba(0, 0, 0, .3);
            animation: fl 5s ease-in-out infinite;
            display: flex;
            gap: 6px;
            align-items: center
        }

        .ctr {
            position: absolute;
            inset: 0;
            display: grid;
            place-content: center;
            text-align: center;
            font: 800 26px Manrope
        }

        .ctr small {
            font: 500 12px Inter;
            color: #9fb8ad
        }

        @keyframes spin {
            to {
                transform: rotate(360deg)
            }
        }

        @keyframes fl {
            50% {
                margin-top: -9px
            }
        }

        @keyframes scan {

            0%,
            100% {
                top: 6%
            }

            50% {
                top: 90%
            }
        }

        .chips {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 4px 0 8px;
            scrollbar-width: none
        }

        .chips button {
            flex: none
        }

        .chips button.on {
            background: var(--fo);
            color: #fff
        }

        .filt {
            display: grid;
            grid-template-columns: 2fr repeat(5, 1fr);
            gap: 10px;
            margin: 16px 0
        }

        .search {
            position: relative
        }

        .search input {
            padding-left: 46px;
            min-height: 58px;
            font-size: 1.05rem;
            border-radius: 20px
        }

        .search svg {
            position: absolute;
            left: 16px;
            top: 19px;
            color: var(--mu)
        }

        .steps {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
            position: relative
        }

        .st {
            padding: 24px;
            border-radius: 22px;
            background: var(--card);
            border: 1px solid var(--ln);
            box-shadow: var(--sh)
        }

        .st b {
            font: 800 40px Manrope;
            color: var(--ac);
            display: block
        }

        .st h3 {
            margin: 6px 0
        }

        .dark {
            background: var(--fo);
            color: #F2F6F3;
            border-radius: 32px;
            padding: 48px
        }

        .dark .mu {
            color: #9fb8ad
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-top: 24px
        }

        .stats>div {
            padding: 20px;
            border-radius: 20px;
            background: rgba(255, 255, 255, .06)
        }

        .stats b {
            font: 800 clamp(1.8rem, 3.5vw, 2.8rem) Manrope;
            display: block
        }

        .pl {
            background: var(--card);
            border: 1px solid var(--ln);
            border-radius: 22px;
            padding: 22px;
            box-shadow: var(--sh);
            margin-bottom: 14px
        }

        .cols {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px
        }

        .jr {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-items: center;
            margin: 10px 0
        }

        .jr span {
            padding: 5px 12px;
            border-radius: 99px;
            background: var(--mint);
            color: var(--acd);
            font-weight: 600;
            font-size: 13px
        }

        .jr i {
            color: var(--mu);
            font-style: normal
        }

        .dt {
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            gap: 36px
        }

        .dt .vis {
            border-radius: 28px;
            aspect-ratio: 1;
            font-size: 150px
        }

        .pf {
            display: grid;
            grid-template-columns: 1.3fr 1fr;
            gap: 30px;
            align-items: start
        }

        .stp {
            display: flex;
            gap: 8px;
            margin: 18px 0
        }

        .stp div {
            flex: 1;
            padding: 10px;
            border-radius: 14px;
            border: 1px solid var(--ln);
            font: 700 13px Manrope;
            color: var(--mu)
        }

        .stp .on {
            background: var(--fo);
            color: #fff
        }

        .err {
            color: var(--bad);
            font-size: 13px;
            min-height: 18px;
            margin-top: 6px
        }

        .ex {
            display: grid;
            place-items: center;
            text-align: center;
            padding: 30px 0
        }

        .glass {
            position: relative;
            width: min(100%, 360px);
            padding: 28px;
            border-radius: 28px;
            background: linear-gradient(160deg, color-mix(in srgb, var(--ac) 18%, var(--card)), var(--card));
            border: 1px solid var(--ln);
            box-shadow: var(--sh);
            backdrop-filter: blur(10px)
        }

        #qr {
            display: flex;
            justify-content: center;
            padding: 14px;
            background: #fff;
            border-radius: 18px;
            position: relative;
            margin: 16px 0;
            overflow: hidden
        }

        .scn {
            position: absolute;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--ac);
            box-shadow: 0 0 14px var(--ac);
            animation: scan 2.4s ease-in-out infinite
        }

        .chat {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 18px;
            min-height: 520px
        }

        .cl button {
            display: block;
            width: 100%;
            text-align: left;
            border-radius: 16px;
            margin-bottom: 8px
        }

        .cl button.on {
            background: var(--mint)
        }

        .msgs {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 48vh;
            overflow: auto;
            padding: 12px 0
        }

        .msg {
            max-width: 78%;
            padding: 9px 14px;
            border-radius: 18px;
            background: var(--mint);
            align-self: flex-start
        }

        .msg.me {
            background: var(--fo);
            color: #fff;
            align-self: flex-end
        }

        .msg small {
            display: block;
            opacity: .7;
            font-size: 11px
        }

        .msg.sys {
            align-self: center;
            background: none;
            color: var(--acd);
            font-size: 13px;
            font-weight: 600
        }

        .banner {
            background: rgba(232, 176, 74, .18);
            border-radius: 16px;
            padding: 12px 16px;
            margin-bottom: 12px;
            font-weight: 500
        }

        .ov {
            position: fixed;
            inset: 0;
            background: rgba(5, 15, 11, .55);
            display: grid;
            place-items: center;
            z-index: 50;
            padding: 16px;
            animation: fi .2s
        }

        .mb {
            background: var(--card);
            border-radius: 26px;
            padding: 26px;
            width: min(480px, 100%);
            max-height: 90vh;
            overflow: auto;
            animation: up .25s
        }

        @keyframes fi {
            from {
                opacity: 0
            }
        }

        @keyframes up {
            from {
                transform: translateY(16px);
                opacity: 0
            }
        }

        #toast {
            position: fixed;
            left: 50%;
            bottom: 90px;
            transform: translate(-50%, 20px);
            background: var(--fo);
            color: #fff;
            padding: 12px 20px;
            border-radius: 99px;
            opacity: 0;
            pointer-events: none;
            transition: .3s;
            z-index: 60;
            max-width: 90vw
        }

        #toast.show {
            opacity: 1;
            transform: translate(-50%, 0)
        }

        .bn {
            display: none
        }

        .sk {
            background: linear-gradient(90deg, var(--ln), transparent, var(--ln));
            background-size: 200%;
            animation: sh 1.2s infinite;
            border-radius: 22px;
            height: 300px
        }

        @keyframes sh {
            to {
                background-position: -200% 0
            }
        }

        .rv {
            opacity: 0;
            transform: translateY(16px);
            transition: .6s
        }

        .rv.in {
            opacity: 1;
            transform: none
        }

        .login {
            max-width: 440px;
            margin: 8vh auto;
            padding: 20px;
            display: grid;
            gap: 10px;
            text-align: center
        }

        .login .loop {
            width: 200px
        }

        @media(max-width:960px) {

            nav,
            header .cta {
                display: none
            }

            .hero,
            .dt,
            .pf {
                grid-template-columns: 1fr
            }

            .hero {
                padding: 34px 24px
            }

            .filt {
                grid-template-columns: 1fr 1fr
            }

            .search {
                grid-column: 1/-1
            }

            .steps,
            .stats {
                grid-template-columns: 1fr 1fr
            }

            .cols {
                grid-template-columns: 1fr
            }

            .chat {
                grid-template-columns: 1fr
            }

            .dark {
                padding: 28px 20px
            }
        }

        @media(max-width:760px) {
            .bn {
                display: flex;
                position: fixed;
                bottom: 0;
                left: 0;
                right: 0;
                z-index: 30;
                background: var(--card);
                border-top: 1px solid var(--ln);
                padding: 6px 6px calc(6px + env(safe-area-inset-bottom, 0px))
            }

            .bn button {
                flex: 1;
                border: 0;
                background: none;
                display: grid;
                justify-items: center;
                gap: 2px;
                font-size: 11px;
                padding: 6px 0;
                color: var(--mu);
                border-radius: 14px;
                box-shadow: none
            }

            .bn .on {
                color: var(--ac)
            }

            .rail {
                display: flex;
                overflow-x: auto;
                scroll-snap-type: x mandatory;
                margin: 0 -20px;
                padding: 0 20px 8px
            }

            .rail>* {
                flex: 0 0 78%;
                scroll-snap-align: start
            }

            .steps,
            .stats {
                grid-template-columns: 1fr
            }

            .sec {
                flex-direction: column;
                align-items: start
            }

            .stick {
                position: fixed;
                left: 0;
                right: 0;
                bottom: 64px;
                background: var(--bg);
                padding: 10px 16px;
                z-index: 25;
                border-top: 1px solid var(--ln)
            }
        }

        @media(prefers-reduced-motion:reduce) {

            *,
            *::before,
            *::after {
                animation: none !important;
                transition: none !important;
                scroll-behavior: auto !important
            }

            .rv {
                opacity: 1;
                transform: none
            }
        }
    </style>
</head>

<body>
    <div id="app"></div>
    <div id="modal"></div>
    <div id="toast" role="status" aria-live="polite"></div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script>
        const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)], K = 'rentreuse_v1', DAY = 864e5;
        const CATS = {Books: '📚', Electronics: '🔌', Tools: '🔧', Sports: '⚽', Study: '🎓', Travel: '🧳', Home: '🏠', Calculators: '🧮', Other: '🎒'}, HUE = {Books: 28, Electronics: 165, Tools: 38, Sports: 150, Study: 260, Travel: 200, Home: 12, Calculators: 210, Other: 90};
        const SPOTS = ['Library main gate', 'Canteen entrance', 'Admin block lobby', 'Security desk (main gate)', 'Sports complex reception'];
        const esc = s => String(s).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));

        document.addEventListener('keydown', e => {if (e.key === 'Escape' && $('#modal').innerHTML) closeM(); if (e.key === 'Enter' && e.target.id === 'ct') document.querySelector('[data-act=send]').click(); if (e.key === 'Enter' && e.target.classList.contains('item')) e.target.click()});
        document.addEventListener('change', e => {
            if (e.target.id !== 'pi' || !e.target.files[0]) return;
            const fr = new FileReader(); fr.onload = () => {const im = new Image(); im.onload = () => {const c = document.createElement('canvas'), k = Math.min(1, 600 / im.width); c.width = im.width * k; c.height = im.height * k; c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); P.photo = c.toDataURL('image/jpeg', .75); prev(); toast('Photo added')}; im.onerror = () => toast('That file could not be read as an image.'); im.src = fr.result}; fr.readAsDataURL(e.target.files[0])
        });
        render();
    </script>
